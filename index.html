<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TalentIQ — J.B. Hunt career fair candidate capture and triage" />
  <title>TalentIQ | J.B. Hunt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" id="fontsLink" />
  <link rel="stylesheet" href="styles.css?v=81" />
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <a class="brand-link" href="#" data-nav="analytics" aria-label="TalentIQ home">
          <div class="brand-logo-wrap">
            <img src="JBHUNT_LOGO.png" alt="J.B. Hunt" class="brand-logo-img" />
          </div>
        </a>
      </div>

      <nav class="sidebar-nav" aria-label="Recruiter workflow"></nav>

      <div class="sidebar-card">
        <div class="sidebar-card__label">Event</div>
        <div class="sidebar-card__event" id="sidebarEventName">Logistics & Technology Fair</div>
        <div class="sidebar-card__meta">
          <span class="meta-date" id="sidebarEventDate">Sep 14, 2026</span>
          <span class="meta-divider"></span>
          <span class="meta-location" id="sidebarEventLocation">Nashville, TN</span>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="icon-button" aria-label="Notifications">
          <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7.5 0 10h12c3-2.5 0-3 0-10z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 21h4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span class="badge-dot"></span>
        </button>
        <button class="icon-button" aria-label="Settings">
          <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true"><path d="M12 3v3M12 18v3M4.7 4.7l2.1 2.1M17.1 17.1l2.1 2.1M3 12h3M18 12h3M4.7 19.3l2.1-2.1M17.1 6.9l2.1-2.1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </aside>

    <main class="main-content" id="mainContent" tabindex="-1">
      <section class="topbar">
        <div class="topbar-left">
          <div class="breadcrumb">
            <span class="breadcrumb-link">J.B. Hunt</span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-link">TalentIQ</span>
          </div>
           <h1 id="pageTitle">Capture</h1>
        </div>
        <div class="topbar-actions">
          <label class="recruiter-picker" title="Active recruiter">
            <span class="recruiter-label">Active recruiter</span>
            <select id="recruiterSelect" aria-label="Active recruiter">
              <option value="">Select recruiter</option>
            </select>
          </label>
          <div class="search-inline" id="globalSearchWrap">
            <svg viewBox="0 0 24 24" class="search-icon" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.2-4.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <input id="globalSearch" type="search" aria-label="Search all candidates" placeholder="Search all candidates..." autocomplete="off" />
          </div>
        </div>
      </section>

      <div id="connectionStatus" class="connection-banner" role="status" hidden></div>
      <div id="viewContainer"></div>
    </main>
  </div>

  <div id="demoLoginRoot"></div>

  <div id="compareBar" class="compare-bar" hidden></div>

  <div id="compareModal" class="compare-modal" hidden>
    <div class="compare-modal__backdrop" data-compare-close></div>
    <div class="compare-modal__dialog" role="dialog" aria-modal="true" aria-label="Candidate comparison">
      <div class="compare-modal__head">
        <div>
          <span class="section-kicker">Candidate Comparison</span>
          <h2>Side-by-Side</h2>
        </div>
        <button class="icon-button small-icon" data-compare-close aria-label="Close">Close</button>
      </div>
      <div class="compare-modal__body" id="compareBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <script src="config.js?v=23"></script>
  <script src="demo-candidates.js?v=6"></script>
  <script src="qrcode-generator.js"></script>
    <script src="data.js?v=26"></script>
  <script src="workflow.js?v=22"></script>
  <script src="analytics.js?v=20"></script>
  <script src="components.js?v=22"></script>
  <script src="skill-icons.js?v=20"></script>
    <script src="views.js?v=79"></script>
  <script src="app.js?v=27"></script>
</body>
</html>
